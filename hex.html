<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hex</title>
<style>
.hex-app {
  --gold: #ffd75e;
  --text: #e9e3d4;
  --text-dim: #a59c86;
  --brass: #b9a978;
  --pad: clamp(14px, 3vw, 32px);
  --ink-s: #c64a3b;
  --ink-o: #24467e;
  --paper-knock: #f2e9d4;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Hoefler Text", Georgia,
    "Times New Roman", serif;
  --font-body: "Avenir Next", "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial,
    sans-serif;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #13151b;
}

.hex-app *,
.hex-app *::before,
.hex-app *::after {
  box-sizing: border-box;
}

.hex-app {
  height: 100vh;
  height: 100dvh;
  font-family: var(--font-body);
  color: var(--text);
  background: radial-gradient(130% 95% at 50% 22%, #2b303b 0%, #1b1f28 48%, #13151b 100%);
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--pad) 16px;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}

.hex-app :focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
  border-radius: 6px;
}

.hex-app .table {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
  flex: 1;
  min-height: 0;
}

.hex-app .boardwrap {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hex-app #board {
  width: auto;
  height: auto;
  aspect-ratio: 1030 / 626;
  max-width: min(100%, 1200px);
  max-height: min(100%, 720px);
  display: block;
  filter: drop-shadow(0 12px 34px rgba(0, 0, 0, 0.55));
  will-change: transform;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

.hex-app #board.tall {
  max-width: min(100%, 720px);
  max-height: min(100%, 1200px);
}

.hex-app #board:focus:not(:focus-visible) {
  outline: none;
}

.hex-app #board.drawing {
  cursor: crosshair;
}

.hex-app .ink .guide path {
  fill: none;
  stroke-width: 7;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.34;
}
.hex-app .ink.s .guide path {
  stroke: var(--ink-s);
}
.hex-app .ink.o .guide path {
  stroke: var(--ink-o);
}
.hex-app .ink .marks path {
  fill: none;
  stroke-width: 8.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 1px 1.2px rgba(58, 44, 26, 0.34));
}
.hex-app .ink.s .marks path {
  stroke: var(--ink-s);
}
.hex-app .ink.o .marks path {
  stroke: var(--ink-o);
}

.hex-app .strike .knock {
  fill: none;
  stroke: var(--paper-knock);
  stroke-linecap: round;
  stroke-linejoin: round;
}
.hex-app .strike .pen {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 1px 1.6px rgba(58, 44, 26, 0.42));
}
.hex-app .strike.s .pen {
  stroke: var(--ink-s);
}
.hex-app .strike.o .pen {
  stroke: var(--ink-o);
}

.hex-app .cellfill.s {
  fill: #c64a3b;
}
.hex-app .cellfill.o {
  fill: #24467e;
}
.hex-app .cellfill {
  fill-opacity: 0.12;
}
@keyframes cellTint {
  from {
    fill-opacity: 0;
  }
  to {
    fill-opacity: 0.12;
  }
}
.hex-app .cellfill.fresh {
  animation: cellTint 0.4s ease both;
}
@media (prefers-reduced-motion: reduce) {
  .hex-app .cellfill.fresh {
    animation: none;
  }
}

.hex-app .coord {
  font-family: var(--font-display);
  fill: #b9a978;
  fill-opacity: 0.9;
}
.hex-app #board.nolabels .coords {
  display: none;
}
.hex-app .hit {
  cursor: pointer;
}
.hex-app .hit:hover {
  fill: #c9762a;
  fill-opacity: 0.07;
}
@media (hover: none) {
  .hex-app .hit:hover {
    fill-opacity: 0;
  }
}
.hex-app .flash {
  transform-box: fill-box;
  transform-origin: center;
}

.hex-app .rail {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.hex-app .status {
  font-family: var(--font-display);
  font-size: 15px;
  color: #d9cfb6;
  text-align: center;
  min-height: 20px;
}
.hex-app .status b {
  color: #ffe9a8;
  font-weight: 700;
}
.hex-app .chip {
  display: inline-block;
  width: 17px;
  height: 17px;
  vertical-align: -3.5px;
  margin-right: 6px;
}

.hex-app .ctl {
  display: grid;
  place-items: center;
}
.hex-app .ctl > * {
  grid-area: 1 / 1;
}
.hex-app .deselect {
  margin-top: 2px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 15px;
  border-radius: 999px;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: #a59c86;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.12);
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.2s ease,
    color 0.2s,
    border-color 0.2s,
    background 0.2s;
}
.hex-app .deselect.show {
  opacity: 1;
  pointer-events: auto;
}
.hex-app .deselect:hover {
  color: #d9cfb6;
  border-color: rgba(255, 215, 94, 0.5);
}
.hex-app .deselect svg {
  width: 12px;
  height: 12px;
}
@media (prefers-reduced-motion: reduce) {
  .hex-app .deselect {
    transition: none;
  }
}
.hex-app .swap {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: opacity 0.2s ease;
}
.hex-app .swap svg {
  width: 15px;
  height: 15px;
}
@media (prefers-reduced-motion: reduce) {
  .hex-app .swap {
    transition: none;
  }
}
.hex-app .deselect:not(.show),
.hex-app .swap:not(.show) {
  opacity: 0;
  pointer-events: none;
}

@keyframes pulseGlow {
  0%,
  100% {
    opacity: 0.22;
  }
  50% {
    opacity: 0.68;
  }
}
@keyframes pulseRing {
  0%,
  100% {
    opacity: 0.45;
  }
  50% {
    opacity: 1;
  }
}
.hex-app .pulseGlow {
  animation: pulseGlow 1.5s ease-in-out infinite;
}
.hex-app .pulseRing {
  animation: pulseRing 1.5s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  .hex-app .pulseGlow,
  .hex-app .pulseRing {
    animation: none !important;
  }
}

@keyframes trace {
  from {
    stroke-dashoffset: var(--len);
  }
  to {
    stroke-dashoffset: 0;
  }
}
.hex-app .trace {
  stroke-dasharray: var(--len);
  animation: trace var(--dur, 0.8s) ease-in-out both;
}
@media (prefers-reduced-motion: reduce) {
  .hex-app .trace {
    animation: none;
  }
}

@media (orientation: landscape) and (max-height: 560px) {
  .hex-app .table {
    gap: 8px;
  }
  .hex-app {
    padding-top: 10px;
    padding-bottom: 10px;
  }
}

.hex-app .overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 16, 0.82);
  display: flex;
  padding: 16px;
  overflow-y: auto;
  z-index: 50;
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}
.hex-app .overlay.hidden {
  display: none;
}
.hex-app .card {
  margin: auto;
  background: linear-gradient(160deg, #2c2620, #1c1813);
  border: 1px solid rgba(255, 225, 170, 0.18);
  border-radius: 18px;
  padding: 30px 34px;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
}
.hex-app .card h1 {
  font-family: var(--font-display);
  font-size: 28px;
  margin: 0 0 4px;
  color: var(--gold);
  letter-spacing: 0.5px;
}
.hex-app .card .sub {
  color: var(--brass);
  font-size: 14px;
  margin-bottom: 12px;
}
.hex-app .card p {
  color: var(--text);
  font-size: 13.5px;
  line-height: 1.5;
  margin: 0 0 6px;
  text-wrap: pretty;
}
.hex-app #bannersub {
  text-wrap: balance;
}

.hex-app button {
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
  padding: 9px 22px;
  border-radius: 9px;
  border: 1.5px solid rgba(255, 215, 94, 0.45);
  background: linear-gradient(145deg, #3a4150, #272c36);
  color: #ffe9a8;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  -webkit-appearance: none;
  appearance: none;
}
.hex-app button:hover {
  border-color: rgba(255, 215, 94, 0.85);
}
.hex-app button:disabled {
  opacity: 0.32;
  cursor: default;
  border-color: rgba(255, 215, 94, 0.25);
}
.hex-app .start {
  margin-top: 8px;
}
.hex-app .dl {
  display: inline-block;
  margin-top: 14px;
  font-size: 13px;
  font-weight: 600;
  color: #ffe9a8;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.hex-app .sizes {
  border: 0;
  margin: 10px 0 4px;
  padding: 0;
  min-width: 0;
}
.hex-app .sizes legend {
  float: left;
  width: 100%;
  padding: 0;
  margin: 0 0 8px;
  font-size: 12.5px;
  color: var(--text-dim);
  text-align: center;
}
.hex-app .pills {
  clear: both;
  display: flex;
  gap: 8px;
  justify-content: center;
}
.hex-app .sz {
  position: relative;
  flex: 0 1 64px;
  min-width: 0;
}
.hex-app .sz input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  margin: 0;
  pointer-events: none;
}
.hex-app .sz span {
  display: grid;
  place-items: center;
  width: 100%;
  height: 44px;
  padding: 0 4px;
  border-radius: 9px;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  color: #a59c86;
  background: rgba(0, 0, 0, 0.26);
  border: 1.5px solid rgba(255, 215, 94, 0.2);
  cursor: pointer;
  transition:
    color 0.15s,
    border-color 0.15s,
    box-shadow 0.15s;
}
.hex-app .sz:hover span {
  border-color: rgba(255, 215, 94, 0.55);
}
.hex-app .sz input:checked + span {
  color: #ffe9a8;
  background: linear-gradient(145deg, #3a4150, #272c36);
  border-color: rgba(255, 215, 94, 0.85);
  box-shadow:
    0 0 0 1px rgba(255, 215, 94, 0.3),
    0 0 16px rgba(205, 164, 52, 0.24);
}
.hex-app .sz input:focus-visible + span {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}
.hex-app .card .hint {
  font-size: 12.5px;
  color: var(--text-dim);
  margin: 9px 0 2px;
  min-height: 19px;
}

.hex-app .fsbtn {
  position: absolute;
  bottom: 16px;
  right: 16px;
  z-index: 5;
  width: 44px;
  height: 44px;
  border-radius: 11px;
  border: 1.5px solid rgba(255, 215, 94, 0.45);
  background: linear-gradient(145deg, #3a4150, #272c36);
  color: #ffe9a8;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  -webkit-appearance: none;
  appearance: none;
  padding: 0;
}
.hex-app .fsbtn:hover {
  border-color: rgba(255, 215, 94, 0.85);
}
.hex-app .fsbtn svg {
  position: absolute;
  top: 50%;
  left: 50%;
  -webkit-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
  width: 24px;
  height: 24px;
  display: block;
}
.hex-app .fsbtn .fs-exit {
  display: none;
}
.hex-app .fsbtn.fs-on .fs-enter {
  display: none;
}
.hex-app .fsbtn.fs-on .fs-exit {
  display: block;
}
.hex-app .gicon-hero {
  display: flex;
  justify-content: center;
  margin: 6px 0 16px;
}
.hex-app .gicon-hero svg {
  width: 88px;
  height: 88px;
}

@media (max-width: 420px) {
  .hex-app .card {
    padding: 26px 20px;
  }
}
@media (max-height: 620px) {
  .hex-app .overlay {
    padding: 8px 16px;
  }
  .hex-app .card {
    padding: 20px 26px;
  }
  .hex-app .card h1 {
    font-size: 24px;
  }
  .hex-app .card .sub {
    margin-bottom: 8px;
  }
  .hex-app .gicon-hero {
    margin: 4px 0 10px;
  }
  .hex-app .gicon-hero svg {
    width: 72px;
    height: 72px;
  }
  .hex-app .sizes {
    margin-top: 8px;
  }
}
@media (max-height: 620px) and (min-width: 600px) {
  .hex-app .card {
    max-width: 540px;
  }
}
</style>
</head>
<body>
<div class="hex-app">
<div class="overlay" id="setup">
  <button class="fsbtn" id="fsbtn" type="button" aria-label="Toggle fullscreen">
    <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8 V3 H8 M21 8 V3 H16 M3 16 V21 H8 M21 16 V21 H16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 V8 H3 M16 3 V8 H21 M8 21 V16 H3 M16 21 V16 H21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="card">
    <h1>Hex</h1>
    <p class="sub">Connect your two edges</p>
    <p>Tap a hex, then draw your mark over the guide. Xs link the red edges, Os the blue; the first unbroken chain wins, and someone always makes one, so there are no draws. X opens, and O may then swap sides to claim that first X.</p>
    <div class="gicon-hero"><svg id="gameicon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="7" y="7" width="50" height="50" rx="5" fill="#d8a24e"/><g fill="none" stroke="#4a3016" stroke-linejoin="round"><g stroke-width="1.15"><polygon points="32.00,24.00 38.93,28.00 38.93,36.00 32.00,40.00 25.07,36.00 25.07,28.00"/><polygon points="45.86,24.00 52.78,28.00 52.78,36.00 45.86,40.00 38.93,36.00 38.93,28.00"/><polygon points="38.93,12.00 45.86,16.00 45.86,24.00 38.93,28.00 32.00,24.00 32.00,16.00"/><polygon points="25.07,12.00 32.00,16.00 32.00,24.00 25.07,28.00 18.14,24.00 18.14,16.00"/><polygon points="18.14,24.00 25.07,28.00 25.07,36.00 18.14,40.00 11.22,36.00 11.22,28.00"/><polygon points="25.07,36.00 32.00,40.00 32.00,48.00 25.07,52.00 18.14,48.00 18.14,40.00"/><polygon points="38.93,36.00 45.86,40.00 45.86,48.00 38.93,52.00 32.00,48.00 32.00,40.00"/></g><polygon points="18.14,16.00 25.07,12.00 32.00,16.00 38.93,12.00 45.86,16.00 45.86,24.00 52.78,28.00 52.78,36.00 45.86,40.00 45.86,48.00 38.93,52.00 32.00,48.00 25.07,52.00 18.14,48.00 18.14,40.00 11.22,36.00 11.22,28.00 18.14,24.00" stroke-width="2.65"/></g></svg></div>
    <fieldset class="sizes">
      <legend>Board size</legend>
      <div class="pills">
        <label class="sz"><input type="radio" name="size" value="9"><span>9</span></label>
        <label class="sz"><input type="radio" name="size" value="11" checked><span>11</span></label>
        <label class="sz"><input type="radio" name="size" value="14"><span>14</span></label>
      </div>
      <p class="hint" id="sizehint"></p>
    </fieldset>
    <button class="start" id="startbtn" type="button">Start Game</button>
  </div>
</div>

<main class="table">
  <div class="boardwrap" id="boardwrap">
  <svg id="board" viewBox="0 0 1030 626" xmlns="http://www.w3.org/2000/svg" tabindex="0" role="application" aria-label="Hex board">
    <defs>
      <linearGradient id="wood" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="#855f3a"/><stop offset="38%" stop-color="#5e4128"/><stop offset="100%" stop-color="#311e0d"/></linearGradient>
      <pattern id="grain" patternUnits="userSpaceOnUse" width="13" height="13" patternTransform="rotate(63)"><rect width="6.5" height="13" fill="#000000" fill-opacity="0.10"/><rect x="6.5" width="6.5" height="13" fill="#fff0d2" fill-opacity="0.03"/></pattern>
      <linearGradient id="paper" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0%" stop-color="#f2e9d4"/><stop offset="45%" stop-color="#e8dcc0"/><stop offset="100%" stop-color="#d6c7a6"/></linearGradient>
      <pattern id="tooth" patternUnits="userSpaceOnUse" width="7" height="7">
        <circle cx="1.6" cy="1.9" r="0.85" fill="#8a7a58" fill-opacity="0.10"/>
        <circle cx="5.1" cy="4.6" r="0.7" fill="#6d5f42" fill-opacity="0.08"/>
        <circle cx="3.4" cy="6.2" r="0.55" fill="#fffdf4" fill-opacity="0.30"/>
      </pattern>
      <pattern id="hatchs" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-38)"><rect width="5" height="5" fill="#c64a3b" fill-opacity="0.08"/><rect y="2" width="5" height="1.1" fill="#c64a3b" fill-opacity="0.45"/></pattern>
      <pattern id="hatcho" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-38)"><rect width="5" height="5" fill="#24467e" fill-opacity="0.07"/><rect y="2" width="5" height="1.1" fill="#24467e" fill-opacity="0.34"/></pattern>
      <radialGradient id="glowhalo" cx="50%" cy="50%" r="50%"><stop offset="35%" stop-color="#ffc846" stop-opacity="0.7"/><stop offset="100%" stop-color="#ffc846" stop-opacity="0"/></radialGradient>
    </defs>
    <g id="staticG"></g>
    <g id="fillG" pointer-events="none"></g>
    <g id="inkG" pointer-events="none"></g>
    <g id="strikeG" pointer-events="none"></g>
    <g id="flashG" pointer-events="none"></g>
    <g id="fxG" pointer-events="none"></g>
    <g id="cursorG" pointer-events="none"></g>
    <g id="hitG"></g>
  </svg>
  </div>

  <div class="rail">
    <div class="status" id="status"></div>
    <div class="ctl">
      <button class="deselect" id="deselect" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        Deselect
      </button>
      <button class="swap" id="swapbtn" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8 H18 M14 4 L18 8 L14 12 M20 16 H6 M10 12 L6 16 L10 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Swap sides
      </button>
    </div>
  </div>
</main>

<div class="overlay hidden" id="banner">
  <button class="fsbtn" id="fsbtn-end" type="button" aria-label="Toggle fullscreen">
    <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8 V3 H8 M21 8 V3 H16 M3 16 V21 H8 M21 16 V21 H16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 V8 H3 M16 3 V8 H21 M8 21 V16 H3 M16 21 V16 H21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="card">
    <h1 id="bannertitle"></h1>
    <p id="bannersub"></p>
    <button class="start" id="againbtn" type="button">Play Again</button>
  </div>
</div>
</div>
<script>
"use strict";

/**
 * Hex board game. Mounts into a pre-rendered DOM tree (ids from HexApp)
 * and returns a cleanup function for React Strict Mode / HMR.
 */
function mountHex(root) {
  const SVGNS = "http://www.w3.org/2000/svg";
  const S = 30;
  const W = Math.sqrt(3) * S;
  const PITCH = 1.5 * S;
  const HATCH = 0.42 * S,
    PAPER_MARGIN = 0.14 * S,
    FRAME = 1.0 * S;
  const E_HATCH = S + HATCH,
    E_SHEET = E_HATCH + PAPER_MARGIN,

    document.addEventListener("webkitfullscreenchange", sync, { signal });
    for (var j = 0; j < btns.length; j++)
      btns[j].addEventListener(
        "click",
        function () {
          if (window.fsElement()) window.fsExit();
          else window.fsEnter();
        },
        { signal },
      );
  }
  var ab = $("againbtn");
  if (ab) {
    ab.addEventListener(
      "click",
      function () {
        audio();
        $("banner").classList.add("hidden");
        $("setup").classList.remove("hidden");
      },
      { signal },
    );
  }
  var sb = $("startbtn");
  if (sb) {
    sb.addEventListener(
      "click",
      function () {
        audio();
        var s = $("setup");
        if (s) s.classList.add("hidden");
        newGame(chosenSize());
        boardEl.focus();
      },
      { signal },
    );
  }

  return function unmount() {
    ac.abort();
    if (ro) ro.disconnect();
    pendingTimeouts.forEach((id) => window.clearTimeout(id));
    pendingTimeouts.clear();
    clearTimers();
    clearActive();
    try {
      if (actx && actx.state !== "closed") actx.close();
    } catch (e) {}
    delete window.__hex;
    delete window.fsElement;
    delete window.fsEnter;
    delete window.fsExit;
  };
}

mountHex(document.querySelector('.hex-app'));
</script>
</body>
</html>
